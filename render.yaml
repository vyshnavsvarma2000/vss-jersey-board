# Free Render web service. Standalone repo: remove rootDir line.
services:
  - type: web
    name: vss-jersey-board
    runtime: node
    plan: free
    rootDir: team-jersey-board
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        sync: false
      - key: CAPTAIN_SECRET
        sync: false
